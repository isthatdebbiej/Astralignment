name: astralignment
services:
  dimos:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dimos
    restart: unless-stopped
    init: true
    environment:
      SIM_URL: http://sim:8001
    depends_on:
      sim: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  turn:
    image: coturn/coturn:4.18.0-r0-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - /etc/astra/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
  sim:
    build:
      context: .
      dockerfile: deploy/Dockerfile.sim
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - sim_artifacts:/app/artifacts
  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    init: true
    env_file: /etc/astra/gateway.env
    environment:
      HOST: 0.0.0.0
      SIM_URL: http://sim:8001
      DIMOS_URL: http://dimos:8003
    depends_on:
      sim: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - gateway_runtime:/app/runtime
      - gateway_artifacts:/app/artifacts
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      ASTRA_HOSTNAME: astralignment.64.177.14.149.sslip.io
    ports: ["80:80", "443:443", "443:443/udp"]
    depends_on: [gateway]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  sim_artifacts:
  gateway_runtime:
  gateway_artifacts:
  caddy_data:
  caddy_config:
