# Local-only preview. Do not publish these ports on public interfaces.
services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.curation
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      CURATION_WORKER_TOKEN: ${CURATION_WORKER_TOKEN:?Set a random worker token before starting Compose}
      CURATION_MAX_IMPORT_BYTES: ${CURATION_MAX_IMPORT_BYTES:-21474836480}
      CURATION_METADATA_MAX_BYTES: ${CURATION_METADATA_MAX_BYTES:-268435456}
      CURATION_EXPORT_MAX_BYTES: ${CURATION_EXPORT_MAX_BYTES:-1073741824}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/v1/settings').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    volumes:
      - curation-data:/data
      - ${CURATION_SOURCE_ROOT:-./runtime/sources}:/sources:ro
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.curation-worker
    environment:
      CURATION_API: http://api:8788
      CURATION_WORKER_TOKEN: ${CURATION_WORKER_TOKEN:?Set a random worker token before starting Compose}
      CURATION_MAX_IMPORT_BYTES: ${CURATION_MAX_IMPORT_BYTES:-21474836480}
      CURATION_EXPORT_MAX_BYTES: ${CURATION_EXPORT_MAX_BYTES:-1073741824}
    volumes:
      - curation-data:/data
      - ${CURATION_SOURCE_ROOT:-./runtime/sources}:/sources:ro
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
volumes:
  curation-data:
